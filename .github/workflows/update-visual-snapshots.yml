name: Update visual snapshots

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to update snapshots on (your PR branch)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-snapshots:
    name: Update visual baselines on ${{ inputs.branch }}
    runs-on: ubuntu-22.04
    steps:
      - name: Git Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: packages/web

      - name: Build repo
        run: npm run build

      - name: Update visual snapshots
        run: npm run test:visual:update
        working-directory: packages/web

      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/web/src/components/**/test/__screenshots__
          # Only commit if there are actual changes
          git diff --staged --quiet || git commit -m "chore(visual): update snapshot baselines [skip ci]"
          git push
