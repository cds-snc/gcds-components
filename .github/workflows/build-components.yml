name: Build components
on:
  workflow_dispatch:
  pull_request:
      branches:
        - main

jobs:
  build-packages:
    name: Build all packages
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@dda4788290998366da86b6a4f497909644397bb2
        with:
          node-version: 18

      - name: Install repo
        run: npm install

      - name: Build gcds-components
        run: npm run build

      - name: Check custom elements manifest and web-types are up to date
        run: |
          if ! git diff --exit-code -- packages/web/specs/custom-elements.json packages/web/specs/web-types.json; then
            echo "::error::custom-elements.json or web-types.json is out of date. Run 'npm run build:web' and commit the result."
            exit 1
          fi

      - name: Check custom elements manifest and web-types ship in the package
        working-directory: packages/web
        run: |
          npm pack --dry-run --ignore-scripts --json \
            | node -e "const files = JSON.parse(require('fs').readFileSync(0))[0].files.map(f => f.path); const pkg = require('./package.json'); for (const target of [pkg.customElements, pkg['web-types']]) { if (!files.includes(target)) { console.error('::error::' + target + ' is not in the npm package'); process.exit(1); } console.log(target + ' is included in the package'); }"

  build-storybook:
    name: Build storybook
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@dda4788290998366da86b6a4f497909644397bb2
        with:
          node-version: 18

      - name: Install gcds-components
        run: npm install

      - name: Build gcds-components
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook
