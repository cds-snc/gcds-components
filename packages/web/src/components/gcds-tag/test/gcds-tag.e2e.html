<!doctype html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0"
    />
    <title>Stencil Component Starter</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans&display=swap"
      rel="stylesheet"
    />

    <!-- Local components -->
    <link rel="stylesheet" href="/build/gcds.css" />
    <script type="module" src="/build/gcds.esm.js"></script>
    <script nomodule src="/build/gcds.js"></script>
  </head>

  <body>
    <gcds-tag>Tag text</gcds-tag>
    <gcds-tag color="blue" size="regular">Tag text</gcds-tag>
    <gcds-tag color="blue" size="small">Tag text</gcds-tag>
    <gcds-tag color="gray" size="regular">Tag text</gcds-tag>
    <gcds-tag color="gray" size="small">Tag text</gcds-tag>
    <gcds-tag color="green" size="regular">Tag text</gcds-tag>
    <gcds-tag color="green" size="small">Tag text</gcds-tag>
    <gcds-tag color="purple" size="regular">Tag text</gcds-tag>
    <gcds-tag color="purple" size="small">Tag text</gcds-tag>
    <gcds-tag color="red" size="regular">Tag text</gcds-tag>
    <gcds-tag color="red" size="small">Tag text</gcds-tag>
    <gcds-tag color="yellow" size="regular">Tag text</gcds-tag>
    <gcds-tag color="yellow" size="small">Tag text</gcds-tag>
    <gcds-tag id="short-label">Twenty characters!!</gcds-tag>
    <gcds-tag id="long-label">
      This label is longer than 20 characters
    </gcds-tag>
    <ul aria-label="Topics">
      <li><gcds-tag color="blue">Health</gcds-tag></li>
      <li><gcds-tag color="green">Environment</gcds-tag></li>
    </ul>
  </body>
</html>
