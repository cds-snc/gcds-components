<!doctype html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0"
    />
    <title>Component preview: gcds-combobox</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans&display=swap"
      rel="stylesheet"
    />

    <!-- GCDS build -->
    <link rel="stylesheet" href="/build/gcds.css" />
    <script type="module" src="/build/gcds.esm.js"></script>

    <style>
      *,
      *::before,
      *::after {
        animation: none !important;
        box-sizing: border-box;
      }

      html {
        font-size: 16px;
      }

      body {
        background-color: var(--gcds-bg-white);
        color: var(--gcds-text-primary);
        font-family: var(--gcds-font-families-body), sans-serif;
        font-size: var(--gcds-font-sizes-text);
        line-height: var(--gcds-line-heights-text);
        margin: 0;
        padding: 0;
      }

      .preview-variant {
        margin-bottom: var(--gcds-spacing-600);
      }

      .preview-component {
        max-width: 52rem;
        padding: var(--gcds-spacing-300);
      }
    </style>
  </head>

  <body>
    <main>
      <gcds-heading tag="h1">gcds-combobox</gcds-heading>

      <section data-variant="default" class="preview-variant">
        <gcds-heading tag="h2">Default</gcds-heading>
        <div class="preview-component">
          <gcds-combobox
            input-id="default"
            name="default"
            label="Topics"
            options='[{"Design":"design"},{"Development":"development"},{"Research":"research"}]'
          ></gcds-combobox>
        </div>
      </section>

      <section data-variant="selected" class="preview-variant">
        <gcds-heading tag="h2">Selected option</gcds-heading>
        <div class="preview-component">
          <gcds-combobox
            id="selected-combobox"
            input-id="selected"
            name="selected"
            label="Topics"
            options='[{"Design":"design"},{"Development":"development"},{"Research":"research"}]'
          ></gcds-combobox>
        </div>
      </section>

      <section data-variant="disabled" class="preview-variant">
        <gcds-heading tag="h2">Disabled</gcds-heading>
        <div class="preview-component">
          <gcds-combobox
            input-id="disabled"
            name="disabled"
            label="Topics"
            disabled
            options='[{"Design":"design"},{"Development":"development"}]'
          ></gcds-combobox>
        </div>
      </section>

      <section data-variant="error-message" class="preview-variant">
        <gcds-heading tag="h2">Error message</gcds-heading>
        <div class="preview-component">
          <gcds-combobox
            input-id="error"
            name="error"
            label="Topics"
            error-message="Choose at least one topic."
            options='[{"Design":"design"},{"Development":"development"}]'
          ></gcds-combobox>
        </div>
      </section>

      <section data-variant="hint" class="preview-variant">
        <gcds-heading tag="h2">Hint</gcds-heading>
        <div class="preview-component">
          <gcds-combobox
            input-id="hint"
            name="hint"
            label="Topics"
            hint="Search for one or more topics."
            options='[{"Design":"design"},{"Development":"development"}]'
          ></gcds-combobox>
        </div>
      </section>

      <section data-variant="required" class="preview-variant">
        <gcds-heading tag="h2">Required</gcds-heading>
        <div class="preview-component">
          <gcds-combobox
            input-id="required"
            name="required"
            label="Topics"
            required
            options='[{"Design":"design"},{"Development":"development"}]'
          ></gcds-combobox>
        </div>
      </section>

      <section data-variant="select-all" class="preview-variant">
        <gcds-heading tag="h2">Select all</gcds-heading>
        <div class="preview-component">
          <gcds-combobox
            input-id="select-all"
            name="select-all"
            label="Topics"
            enable-select-all
            options='[{"Design":"design"},{"Development":"development"},{"Research":"research"}]'
          ></gcds-combobox>
        </div>
      </section>

      <section data-variant="french" class="preview-variant">
        <gcds-heading tag="h2">French</gcds-heading>
        <div class="preview-component">
          <gcds-combobox
            input-id="french"
            name="french"
            label="Sujets"
            lang="fr"
            options='[{"Conception":"conception"},{"Recherche":"recherche"}]'
          ></gcds-combobox>
        </div>
      </section>
    </main>

    <script type="module">
      const combobox = document.querySelector('#selected-combobox');
      await combobox.componentOnReady();
      combobox.selectedOptions = [{ label: 'Design', value: 'design' }];
    </script>
  </body>
</html>
